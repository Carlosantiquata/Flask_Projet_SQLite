<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque - MyTasks</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f0ff; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        h1 { color: #673ab7; text-align: center; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 8px; }
        .book-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f3f0ff; }
        .btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-emprunt { background-color: #7e57c2; }
        .btn-delete { background-color: #e57373; margin-left: 10px; }
        .badge { background: #ede7f6; color: #673ab7; padding: 4px 8px; border-radius: 5px; font-size: 0.8em; }
        a { text-decoration: none; color: #7e57c2; }
    </style>
</head>

        <a href="/">⬅ Retour Tableau de bord</a>
        <h1>📚 La Bibliothèque</h1>

            <input type="text" name="q" placeholder="Rechercher un livre...">
