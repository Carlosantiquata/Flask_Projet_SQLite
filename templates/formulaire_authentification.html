<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MyTasks</title>
    <style>
        /* Style général inspiré du thème Lavande */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f0ff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* La carte centrale */
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(103, 58, 183, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #673ab7;
            margin-bottom: 25px;
        }

        /* Style des champs de saisie */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #5e35b1;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ede7f6;
            border-radius: 8px;
            box-sizing: border-box; /* Important pour que le padding ne dépasse pas */
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #7e57c2;
        }

        /* Style du bouton */
        input[type="submit"] {
            width: 100%;
            background-color: #7e57c2;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #673ab7;
            transform: translateY(-2px);
        }

        /* Message d'erreur */
        .error-msg {
            background-color: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9em;
            border: 1px solid #ef9a9a;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #9575cd;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>🔑 Connexion</h2>

        {% if error %}
            <div class="error-msg">
                Identifiant ou mot de passe incorrect.
            </div>
        {% endif %}

        <form action="{{ url_for('authentification') }}" method="post">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" placeholder="Entrez votre pseudo" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <input type="submit" value="Se connecter">
        </form>

        <a href="/" class="back-link">⬅ Retour à l'accueil</a>
    </div>

</body>
</html>
